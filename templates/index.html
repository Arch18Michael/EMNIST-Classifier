<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMNIST Classifier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            background: #f5f5f7;
            color: #1d1d1f;
        }

        .card {
            width: 90%;
            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .logo {
            width: 60px;
            height: 60px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 16px;

            background: #111;
            color: white;

            font-size: 28px;
            font-weight: 700;
        }

        h1 {
            margin: 0;

            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .descripcion {
            margin: 10px 0 30px;

            color: #6e6e73;

            font-size: 15px;
            line-height: 1.5;
        }

        .upload {
            border: 1.5px dashed #c7c7cc;

            border-radius: 14px;

            padding: 25px 15px;

            margin-bottom: 18px;

            background: #fafafa;
        }

        .upload p {
            margin: 0 0 15px;

            font-size: 14px;

            color: #6e6e73;
        }

        input[type="file"] {
            width: 100%;

            font-size: 14px;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 12px;

            background: #111;
            color: white;

            font-size: 15px;
            font-weight: 500;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #333;
            transform: translateY(-1px);
        }

        .resultado {
            margin-top: 28px;

            padding: 25px;

            border-radius: 15px;

            background: #f5f5f7;
        }

        .resultado-titulo {
            margin: 0 0 10px;

            color: #6e6e73;

            font-size: 13px;
            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .letra {
            margin: 5px 0;

            font-size: 70px;
            font-weight: 700;

            line-height: 1;
        }

        .confianza {
            margin-top: 12px;

            font-size: 15px;

            color: #6e6e73;
        }

        .confianza strong {
            color: #1d1d1f;
        }

        .error {
            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            background: #fff1f1;

            color: #c62828;

            font-size: 14px;
        }

        .footer {
            margin-top: 25px;

            font-size: 12px;

            color: #86868b;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">
            E
        </div>

        <h1>EMNIST Classifier</h1>

        <p class="descripcion">
            Sube una imagen de una letra y deja que
            nuestro modelo de Deep Learning la identifique.
        </p>


        <form action="/predecir"
              method="POST"
              enctype="multipart/form-data">

            <div class="upload">

                <p>
                    Selecciona una imagen
                </p>

                <input
                    type="file"
                    name="imagen"
                    accept=".jpg,.jpeg,.png"
                    required
                >

            </div>


            <button type="submit">
                Predecir letra
            </button>

        </form>


        {% if resultado %}

        <div class="resultado">

            <p class="resultado-titulo">
                Predicción
            </p>

            <div class="letra">
                {{ resultado }}
            </div>

            <div class="confianza">
                Confianza:
                <strong>{{ confianza }}</strong>
            </div>

        </div>

        {% endif %}


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <div class="footer">
            TensorFlow · Keras · EMNIST Balanced
        </div>

    </div>

</body>
</html>
